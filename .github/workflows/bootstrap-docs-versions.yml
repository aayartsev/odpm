# One-shot: bootstrap mike docs for stable (4.3.0) + aliases stable/4.3.
# Run after P1 lands on 4.4-dev, before or after Bootstrap Pages repos.
name: Bootstrap docs versions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose docs/ tree to publish (e.g. v4.3.0)
        default: v4.3.0
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4.4-dev
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs and mike
        run: pip install -r requirements-docs.txt

      - name: Prepare docs tree for bootstrap
        run: ./scripts/prepare_bootstrap_docs.sh "${{ inputs.tag }}"

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preserve live package repos
        run: |
          set -euo pipefail
          ./scripts/preserve_live_pages_repos.sh /tmp/preserve-apt /tmp/preserve-yum

      - name: Deploy stable docs with mike
        id: mike
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          SITE_DIR="$(
            ./scripts/mike_pages_deploy.sh "${VERSION}" 4.3 stable \
              --title "${VERSION} (stable)" \
              --update-aliases \
              --set-default stable | tee /dev/stderr |
              awk -F= '/^SITE_DIR=/ { print $2; exit }'
          )"
          FINALIZE_APT=""
          FINALIZE_YUM=""
          if [[ -f /tmp/preserve-apt/dists/stable/Release \
             || -f /tmp/preserve-apt/dists/testing/Release ]]; then
            FINALIZE_APT="/tmp/preserve-apt"
          fi
          if [[ -f /tmp/preserve-yum/stable/repodata/repomd.xml \
             || -f /tmp/preserve-yum/testing/repodata/repomd.xml ]]; then
            FINALIZE_YUM="/tmp/preserve-yum"
          fi
          ./scripts/mike_pages_finalize.sh "${SITE_DIR}" \
            ${FINALIZE_APT:+"${FINALIZE_APT}"} \
            ${FINALIZE_YUM:+"${FINALIZE_YUM}"}
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.mike.outputs.site_dir }}
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4
