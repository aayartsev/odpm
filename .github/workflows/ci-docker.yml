# Docker integration CI (4.5 policy — ADR-006):
# - compose-smoke: required PR gate (T1) — minimal in-repo fixture (v1 flat); secrets
#   pipeline validated via tests.test_ci_secrets_smoke (developer mount + ci bake).
# - compose-smoke-mailpit: manifest v2 + services.mailpit (ODPM_COMPOSE_SMOKE_MAILPIT=1).
# - http-smoke: required PR gate (T2) — ephemeral GHA; Mailpit compose up + HTTP 200.
# - golden-path: opt-in T3 on self-hosted runner; vars.ODPM_GOLDEN_PATH_ENABLED +
#   secret ODPM_GOLDEN_PATH_PROJECT; nightly / workflow_dispatch / PR label run-docker.
name: CI Docker

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - 4.5-dev
      - main
  pull_request:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - 4.5-dev
      - main
  schedule:
    # Nightly full golden-path (requires ODPM_GOLDEN_PATH_ENABLED + secret).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_golden:
        description: Run full golden-path HTTP test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ODPM_COMPOSE_SMOKE_IMAGE: odoo-amd64-python-3.12-debian-12:latest

jobs:
  # PR merge gate: tests/fixtures/minimal_odpm_project (see README CI matrix).
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install odpm (editable)
        run: pip install -e .

      - name: Run CI secrets smoke tests
        run: python -m unittest tests.test_ci_secrets_smoke -v

      - name: Restore odpm base image cache
        id: docker-image-cache
        uses: actions/cache@v5
        with:
          path: /tmp/odpm-ci-docker-cache
          key: odpm-compose-smoke-v1-${{ hashFiles('dev_project/templates/**', 'tests/fixtures/minimal_odpm_project/**') }}
          restore-keys: |
            odpm-compose-smoke-v1-

      - name: Load cached odpm base image
        if: steps.docker-image-cache.outputs.cache-hit == 'true'
        run: |
          if [[ -f /tmp/odpm-ci-docker-cache/odoo-base.tar ]]; then
            docker load -i /tmp/odpm-ci-docker-cache/odoo-base.tar
          fi

      - name: Run compose smoke integration test
        env:
          ODPM_RUN_DOCKER_COMPOSE_SMOKE: "1"
          ODPM_COMPOSE_SMOKE_TIMEOUT: "900"
        run: python -m unittest tests.integration.test_compose_smoke -v

      - name: Run compose smoke mailpit (manifest v2 services)
        env:
          ODPM_RUN_DOCKER_COMPOSE_SMOKE: "1"
          ODPM_COMPOSE_SMOKE_MAILPIT: "1"
          ODPM_COMPOSE_SMOKE_TIMEOUT: "900"
        run: python -m unittest tests.integration.test_compose_smoke.ComposeSmokeMailpitIntegrationTests -v

      - name: Save odpm base image to cache
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/odpm-ci-docker-cache
          if docker image inspect "${ODPM_COMPOSE_SMOKE_IMAGE}" >/dev/null 2>&1; then
            docker save "${ODPM_COMPOSE_SMOKE_IMAGE}" -o /tmp/odpm-ci-docker-cache/odoo-base.tar
          fi

  # Mandatory PR gate (ADR-006 T2): ephemeral ubuntu-latest, in-repo Mailpit fixture.
  http-smoke:
    needs: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install odpm (editable)
        run: pip install -e .

      - name: Restore odpm base image cache
        id: docker-image-cache
        uses: actions/cache@v5
        with:
          path: /tmp/odpm-ci-docker-cache
          key: odpm-compose-smoke-v1-${{ hashFiles('dev_project/templates/**', 'tests/fixtures/minimal_odpm_project/**') }}
          restore-keys: |
            odpm-compose-smoke-v1-

      - name: Load cached odpm base image
        if: steps.docker-image-cache.outputs.cache-hit == 'true'
        run: |
          if [[ -f /tmp/odpm-ci-docker-cache/odoo-base.tar ]]; then
            docker load -i /tmp/odpm-ci-docker-cache/odoo-base.tar
          fi

      - name: Run HTTP smoke integration test
        env:
          ODPM_RUN_HTTP_SMOKE: "1"
          ODPM_HTTP_SMOKE_TIMEOUT: "600"
          ODPM_COMPOSE_SMOKE_TIMEOUT: "900"
        run: python -m unittest tests.integration.test_http_smoke -v

  # Opt-in E2E (T3): skipped without ODPM_GOLDEN_PATH_ENABLED (not a false green).
  # secrets.* cannot be used in job if: — use a repo variable for the gate.
  golden-path:
    needs: compose-smoke
    if: >-
      vars.ODPM_GOLDEN_PATH_ENABLED == 'true'
      && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.run_golden)
        || (
          github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'run-docker')
        )
      )
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Require golden-path secret and project directory
        run: |
          if [[ -z "${ODPM_GOLDEN_PATH_PROJECT}" ]]; then
            echo "::error::ODPM_GOLDEN_PATH_PROJECT secret is not configured"
            exit 1
          fi
          if [[ ! -d "${ODPM_GOLDEN_PATH_PROJECT}" ]]; then
            echo "::error::Project directory not found on the self-hosted runner"
            exit 1
          fi
          if [[ ! -f "${ODPM_GOLDEN_PATH_PROJECT}/docker-compose.yml" ]]; then
            echo "::error::Missing docker-compose.yml in project directory"
            exit 1
          fi
        env:
          ODPM_GOLDEN_PATH_PROJECT: ${{ secrets.ODPM_GOLDEN_PATH_PROJECT }}

      # Self-hosted OS (e.g. Linux Mint) may be absent from setup-python manifests.
      - name: Verify Python 3.12 on runner
        run: |
          if ! command -v python3.12 >/dev/null 2>&1; then
            echo "::error::python3.12 not found on self-hosted runner (install via deadsnakes PPA or equivalent)"
            exit 1
          fi
          python3.12 --version

      - name: Install odpm (editable, venv)
        run: |
          python3.12 -m venv .ci-golden-venv
          .ci-golden-venv/bin/pip install -e .

      - name: Run golden-path integration test
        env:
          ODPM_RUN_DOCKER_INTEGRATION: "1"
          ODPM_GOLDEN_PATH_PROJECT: ${{ secrets.ODPM_GOLDEN_PATH_PROJECT }}
          ODPM_GOLDEN_PATH_TIMEOUT: "900"
        run: .ci-golden-venv/bin/python -m unittest tests.integration.test_golden_path -v
