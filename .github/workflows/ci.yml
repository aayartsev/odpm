name: CI

on:
  push:
    branches:
      - 4.0-beta
      - main
  pull_request:
    branches:
      - 4.0-beta
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v4
        with:
          args: check dev_project tests odpm.py

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install odpm (editable)
        run: pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
