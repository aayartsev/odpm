name: CI

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - 4.6.0-dev
      - main
  pull_request:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - 4.6.0-dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check dev_project tests odpm.py

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gettext tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Verify host i18n catalogs
        run: python3 scripts/check_i18n_catalog.py

      - name: i18n coverage inventory (non-blocking)
        run: python3 scripts/audit_user_strings.py --summary

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install odpm (editable)
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install odpm (editable)
        run: pip install -e ".[test]"

      - name: Run 4.4 manifest and extension contract tests
        run: python -m unittest tests.test_manifest_contract -q
