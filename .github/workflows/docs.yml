name: Docs

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Preserve published APT repo on Pages
        run: ./scripts/fetch_pages_repo.sh apt site/apt

      - name: Preserve published YUM repo on Pages
        run: ./scripts/fetch_pages_repo.sh yum site/yum

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
