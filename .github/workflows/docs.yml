name: Docs

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.3.0
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Preserve published APT repo on Pages
        run: |
          set -euo pipefail
          BASE="https://aayartsev.github.io/odpm/apt"
          if curl -fsSL "${BASE}/dists/stable/Release" -o /tmp/apt-release 2>/dev/null || \
             curl -fsSL "${BASE}/dists/testing/Release" -o /tmp/apt-release 2>/dev/null; then
            mkdir -p site/apt
            wget -q -r -np -nH --cut-dirs=2 -P site/apt "${BASE}/" || true
            echo "Preserved apt/ from live Pages"
            find site/apt -type f | head -20
          else
            echo "No live apt repo yet; skipping preserve"
          fi

      - name: Preserve published YUM repo on Pages
        run: |
          set -euo pipefail
          BASE="https://aayartsev.github.io/odpm/yum"
          if curl -fsSL "${BASE}/stable/repodata/repomd.xml" -o /tmp/yum-repomd 2>/dev/null || \
             curl -fsSL "${BASE}/testing/repodata/repomd.xml" -o /tmp/yum-repomd 2>/dev/null; then
            mkdir -p site/yum
            wget -q -r -np -nH --cut-dirs=2 -P site/yum "${BASE}/" || true
            echo "Preserved yum/ from live Pages"
            find site/yum -type f | head -20
          else
            echo "No live yum repo yet; skipping preserve"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
