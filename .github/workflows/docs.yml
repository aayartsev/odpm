name: Docs

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs and mike
        run: pip install -r requirements-docs.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev docs with mike
        id: mike
        run: |
          set -euo pipefail
          SITE_DIR="$(
            ./scripts/mike_pages_deploy.sh dev \
              --title "Development" \
              --update-aliases | tee /dev/stderr |
              awk -F= '/^SITE_DIR=/ { print $2; exit }'
          )"
          ./scripts/mike_pages_finalize.sh "${SITE_DIR}"
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.mike.outputs.site_dir }}

      - id: deployment
        uses: actions/deploy-pages@v4
