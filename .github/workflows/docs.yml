name: Docs

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs and mike
        run: pip install -r requirements-docs.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preserve live package repos
        run: |
          set -euo pipefail
          ./scripts/preserve_live_pages_repos.sh /tmp/preserve-apt /tmp/preserve-yum

      - name: Deploy dev docs with mike
        id: mike
        run: |
          set -euo pipefail
          SITE_DIR="$(
            ./scripts/mike_pages_deploy.sh dev \
              --title "Development" \
              --update-aliases | tee /dev/stderr |
              awk -F= '/^SITE_DIR=/ { print $2; exit }'
          )"
          FINALIZE_APT=""
          FINALIZE_YUM=""
          if [[ -f /tmp/preserve-apt/dists/stable/Release \
             || -f /tmp/preserve-apt/dists/testing/Release ]]; then
            FINALIZE_APT="/tmp/preserve-apt"
          fi
          if [[ -f /tmp/preserve-yum/stable/repodata/repomd.xml \
             || -f /tmp/preserve-yum/testing/repodata/repomd.xml ]]; then
            FINALIZE_YUM="/tmp/preserve-yum"
          fi
          ./scripts/mike_pages_finalize.sh "${SITE_DIR}" \
            ${FINALIZE_APT:+"${FINALIZE_APT}"} \
            ${FINALIZE_YUM:+"${FINALIZE_YUM}"}
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.mike.outputs.site_dir }}
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4
