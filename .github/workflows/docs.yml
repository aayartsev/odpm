name: Docs

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - 4.7.0-dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.gate.outputs.skip }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Skip dev Pages when HEAD has a release tag
        id: gate
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -qE '^v[0-9]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping dev docs deploy: release-packages publishes Pages for tagged commits."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install MkDocs and mike
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements-docs.txt

      - name: Configure git for mike
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preserve live package repos
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ./scripts/preserve_live_pages_repos.sh /tmp/preserve-apt /tmp/preserve-yum

      - name: Deploy dev docs with mike
        if: steps.gate.outputs.skip != 'true'
        id: mike
        run: |
          set -euo pipefail
          SITE_DIR="$(
            ./scripts/mike_pages_deploy.sh dev \
              --title "Development" \
              --update-aliases | tee /dev/stderr |
              awk -F= '/^SITE_DIR=/ { print $2; exit }'
          )"
          FINALIZE_APT=""
          FINALIZE_YUM=""
          if [[ -f /tmp/preserve-apt/dists/stable/Release \
             || -f /tmp/preserve-apt/dists/testing/Release ]]; then
            FINALIZE_APT="/tmp/preserve-apt"
          fi
          if [[ -f /tmp/preserve-yum/stable/repodata/repomd.xml \
             || -f /tmp/preserve-yum/testing/repodata/repomd.xml ]]; then
            FINALIZE_YUM="/tmp/preserve-yum"
          fi
          ./scripts/mike_pages_finalize.sh "${SITE_DIR}" \
            ${FINALIZE_APT:+"${FINALIZE_APT}"} \
            ${FINALIZE_YUM:+"${FINALIZE_YUM}"}
          SITE_DIR="$(
            ./scripts/pages_artifact_from_gh_pages.sh dev | tee /dev/stderr |
              awk -F= '/^SITE_DIR=/ { print $2; exit }'
          )"
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          path: ${{ steps.mike.outputs.site_dir }}
          include-hidden-files: true

      - id: deployment
        if: steps.gate.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

  verify-pages:
    needs: deploy
    if: >-
      always()
      && !cancelled()
      && needs.deploy.result == 'success'
      && needs.deploy.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/verify_pages_deploy.sh
          path: repo

      - name: Verify live Pages (dev docs)
        env:
          ODPM_PAGES_VERIFY_RETRIES: 18
          ODPM_PAGES_VERIFY_SLEEP: 10
        run: ./repo/scripts/verify_pages_deploy.sh --version dev
