# Build .deb + .rpm; upload Actions artifacts on branch push / workflow_dispatch;
# attach assets to GitHub Release on version tags (v*) only.
name: Release packages

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-wheel \
            devscripts lintian git

      - name: Build .deb
        run: ./scripts/build_deb.sh

      - name: Lintian (no errors)
        run: lintian -E dist/odpm_*.deb

      - name: Install smoke (clean Ubuntu 24.04)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/pkgs:ro" \
            ubuntu:24.04 \
            bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkgs/odpm_*.deb
              useradd -m -s /bin/bash odpm-smoke
              runuser -u odpm-smoke -- odpm --version
              runuser -u odpm-smoke -- python3 -c "
          from dev_project.program_dir import resolve_program_dir
          from pathlib import Path
          import dev_project.constants as c
          r = resolve_program_dir()
          assert (Path(r) / c.DEV_PROJECT_DIR / \"templates\").is_dir()
          assert (Path(r) / c.DEV_PROJECT_DIR / \"i18n/ru_RU/LC_MESSAGES/main.mo\").is_file()
          print(\"deb smoke OK\")
          "
            '

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-deb
          path: dist/odpm_*.deb

  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build .rpm (Fedora 41)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            fedora:41 \
            bash -c '
              set -euo pipefail
              dnf install -y -q rpm-build python3-devel python3-setuptools \
                python3-wheel python3-packaging git >/dev/null
              ./scripts/build_rpm.sh
            '

      - name: rpmlint (no errors)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            fedora:41 \
            bash -c '
              set -euo pipefail
              dnf install -y -q rpmlint >/dev/null
              rpmlint -c /src/packaging/rpmlint.toml /src/dist/odpm-*.rpm
            '

      - name: Install smoke (clean Fedora 41)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/pkgs:ro" \
            -v "${{ github.workspace }}/scripts/smoke_rpm_install.sh:/smoke.sh:ro" \
            fedora:41 \
            bash -c '
              set -euo pipefail
              dnf install -y -q passwd >/dev/null
              bash /smoke.sh /pkgs/odpm-*.rpm
            '

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-rpm
          path: dist/odpm-*.rpm

  publish:
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Flatten package artifacts
        run: |
          set -euo pipefail
          find dist -type f \( -name 'odpm-*.rpm' -o -name 'odpm_*.deb' \) -print0 |
            while IFS= read -r -d '' file; do
              target="dist/$(basename "${file}")"
              if [[ "${file}" != "${target}" ]]; then
                mv -f "${file}" "${target}"
              fi
            done
          find dist -mindepth 1 -type d -empty -delete
          echo "Release assets in dist/:"
          ls -la dist/
          test -f dist/odpm_*.deb
          test -f dist/odpm-*.rpm

      - name: Create checksums
        run: |
          cd dist
          sha256sum odpm_*.deb odpm-*.rpm | tee SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Resolve release metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: release_meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=".github/release-notes/${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "Missing release notes: ${NOTES}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-rc* || "${VERSION}" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_meta.outputs.version }}
          body_path: ${{ steps.release_meta.outputs.notes }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          working_directory: dist
          fail_on_unmatched_files: true
          files: |
            odpm_*.deb
            odpm-*.rpm
            SHA256SUMS

      - name: Upload combined package artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            dist/odpm_*.deb
            dist/odpm-*.rpm
            dist/SHA256SUMS
