# Build .deb + .rpm; upload Actions artifacts on branch push / workflow_dispatch;
# attach assets to GitHub Release on version tags (v*) only.
name: Release packages

on:
  push:
    branches:
      - 4.0-beta
      - 4.0-rc1
      - 4.4-dev
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-wheel \
            devscripts lintian git

      - name: Build .deb
        run: ./scripts/build_deb.sh

      - name: Lintian (no errors)
        run: lintian -E dist/odpm_*.deb

      - name: Install smoke (clean Ubuntu 24.04)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/pkgs:ro" \
            ubuntu:24.04 \
            bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkgs/odpm_*.deb
              useradd -m -s /bin/bash odpm-smoke
              runuser -u odpm-smoke -- odpm --version
              runuser -u odpm-smoke -- python3 -c "
          from dev_project.program_dir import resolve_program_dir
          from pathlib import Path
          import dev_project.constants as c
          r = resolve_program_dir()
          assert (Path(r) / c.DEV_PROJECT_DIR / \"templates\").is_dir()
          assert (Path(r) / c.DEV_PROJECT_DIR / \"i18n/ru_RU/LC_MESSAGES/main.mo\").is_file()
          print(\"deb smoke OK\")
          "
            '

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-deb
          path: dist/odpm_*.deb

  rpm:
    strategy:
      fail-fast: false
      matrix:
        fedora: ["40", "41", "44"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build .rpm (Fedora ${{ matrix.fedora }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            fedora:${{ matrix.fedora }} \
            bash -c '
              set -euo pipefail
              dnf install -y -q rpm-build python3-devel python3-setuptools \
                python3-wheel python3-packaging python3-jsonschema python3-pluggy \
                git >/dev/null
              ./scripts/build_rpm.sh
            '

      - name: rpmlint (no errors)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            fedora:${{ matrix.fedora }} \
            bash -c '
              set -euo pipefail
              dnf install -y -q rpmlint >/dev/null
              rpmlint -c /src/packaging/rpmlint.toml /src/dist/odpm-*.rpm
            '

      - name: Install smoke (clean Fedora ${{ matrix.fedora }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/pkgs:ro" \
            -v "${{ github.workspace }}/scripts/smoke_rpm_install.sh:/smoke.sh:ro" \
            fedora:${{ matrix.fedora }} \
            bash -c '
              set -euo pipefail
              dnf install -y -q passwd >/dev/null
              bash /smoke.sh /pkgs/odpm-*.rpm
            '

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-rpm-fc${{ matrix.fedora }}
          path: dist/odpm-*.rpm

  publish:
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Flatten package artifacts
        run: |
          set -euo pipefail
          find dist -type f \( -name 'odpm-*.rpm' -o -name 'odpm_*.deb' \) -print0 |
            while IFS= read -r -d '' file; do
              target="dist/$(basename "${file}")"
              if [[ "${file}" != "${target}" ]]; then
                mv -f "${file}" "${target}"
              fi
            done
          find dist -mindepth 1 -type d -empty -delete
          echo "Release assets in dist/:"
          ls -la dist/
          test -f dist/odpm_*.deb
          mapfile -t rpm_assets < <(find dist -maxdepth 1 -type f -name 'odpm-*.rpm' | sort)
          if [[ "${#rpm_assets[@]}" -lt 3 ]]; then
            echo "expected at least 3 RPM builds (fc40, fc41, fc44), got ${#rpm_assets[@]}" >&2
            printf '  %s\n' "${rpm_assets[@]:-"(none)"}"
            exit 1
          fi

      - name: Create checksums
        run: |
          cd dist
          sha256sum odpm_*.deb odpm-*.rpm | tee SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Resolve release metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: release_meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=".github/release-notes/${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "Missing release notes: ${NOTES}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-rc* || "${VERSION}" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "apt_suite=testing" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "apt_suite=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Import APT signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq reprepro gnupg createrepo-c rpm
          ./scripts/import_apt_signing_key.sh

      - name: Build signed APT repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
        run: |
          ./scripts/build_apt_repo.sh \
            "${{ steps.release_meta.outputs.apt_suite }}" \
            dist/odpm_*.deb \
            apt-repo-out

      - name: Build signed YUM repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
        run: |
          ./scripts/build_yum_repo.sh \
            "${{ steps.release_meta.outputs.apt_suite }}" \
            yum-repo-out \
            dist/odpm-*.rpm

      - name: Upload apt repo artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: apt-repo
          path: apt-repo-out/
          include-hidden-files: true

      - name: Upload yum repo artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: yum-repo
          path: yum-repo-out/
          include-hidden-files: true

      - name: Drop orphan draft releases for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          mapfile -t draft_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.tag_name==\"${TAG}\" and .draft==true) | .id"
          )
          if [[ "${#draft_ids[@]}" -eq 0 ]]; then
            echo "No draft releases for ${TAG}"
            exit 0
          fi
          published_count="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq "[.[] | select(.tag_name==\"${TAG}\" and .draft==false)] | length"
          )"
          if [[ "${published_count}" -eq 0 ]]; then
            echo "No published release for ${TAG}; leaving drafts to action-gh-release"
            exit 0
          fi
          for id in "${draft_ids[@]}"; do
            echo "Deleting orphan draft release ${id} (${TAG})"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done

      - name: Clear release assets before re-upload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if ! release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null
          )"; then
            echo "No release yet for ${TAG}; nothing to clear"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            mapfile -t asset_ids < <(
              gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
                --jq '.[].id'
            )
            if [[ "${#asset_ids[@]}" -eq 0 ]]; then
              echo "Release ${release_id} has no assets"
              exit 0
            fi
            for asset_id in "${asset_ids[@]}"; do
              echo "Deleting release asset ${asset_id} from ${TAG} (attempt ${attempt})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
            sleep 2
          done
          remaining="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
              --jq 'length'
          )"
          if [[ "${remaining}" -ne 0 ]]; then
            echo "Release still has ${remaining} asset(s) after clear retries" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.release_meta.outputs.version }}"
          NOTES="${{ steps.release_meta.outputs.notes }}"
          PRERELEASE="${{ steps.release_meta.outputs.prerelease }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" \
                --title "${VERSION}" \
                --notes-file "${NOTES}" \
                --prerelease \
                --draft=false
            else
              gh release edit "${TAG}" \
                --title "${VERSION}" \
                --notes-file "${NOTES}" \
                --draft=false
            fi
          else
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release create "${TAG}" \
                --title "${VERSION}" \
                --notes-file "${NOTES}" \
                --prerelease
            else
              gh release create "${TAG}" \
                --title "${VERSION}" \
                --notes-file "${NOTES}"
            fi
          fi

          gh release upload "${TAG}" \
            dist/odpm_*.deb \
            dist/odpm-*.rpm \
            dist/SHA256SUMS \
            --clobber

          echo "Release assets:"
          gh release view "${TAG}" --json assets --jq '.assets[].name'

      - name: Upload combined package artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            dist/odpm_*.deb
            dist/odpm-*.rpm
            dist/SHA256SUMS

  publish-pages:
    needs: [deb, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/download-artifact@v7
        with:
          name: apt-repo
          path: apt-repo-out

      - uses: actions/download-artifact@v7
        with:
          name: yum-repo
          path: yum-repo-out

      - name: Merge APT repo into site
        run: |
          set -euo pipefail
          mkdir -p site/apt
          cp -a apt-repo-out/dists site/apt/
          cp -a apt-repo-out/pool site/apt/
          cp apt-repo-out/odpm-archive-keyring.gpg site/apt/
          find site/apt -type f | sort

      - name: Merge YUM repo into site
        run: |
          set -euo pipefail
          mkdir -p site/yum
          cp yum-repo-out/odpm-archive-keyring.asc site/yum/
          for suite in stable testing; do
            if [[ -d yum-repo-out/${suite} ]]; then
              cp -a "yum-repo-out/${suite}" "site/yum/${suite}"
            fi
          done
          find site/yum -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
