# odpm repository lint (not the Odoo project pre-commit inside the container).
# Optional for contributors: pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(dev_project/|tests/|odpm\.py)
