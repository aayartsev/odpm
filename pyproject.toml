[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "odpm"
dynamic = ["version"]
description = "Odoo Developers Project Manager"
readme = "README.MD"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "odpm maintainers", email = "odpm-maintainers@noreply.github.com" },
]
keywords = ["odoo", "docker", "development", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "jsonschema>=4.0",
    "packaging>=23.0",
    "pluggy>=1.3",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
test = ["tomli>=2.0; python_version<'3.11'"]

[project.urls]
Homepage = "https://github.com/aayartsev/odpm"
Documentation = "https://aayartsev.github.io/odpm/"
Repository = "https://github.com/aayartsev/odpm"
Issues = "https://github.com/aayartsev/odpm/issues"
Changelog = "https://github.com/aayartsev/odpm/blob/4.0-beta/CHANGELOG.md"

[project.scripts]
odpm = "dev_project.cli:main"

[project.entry-points."odpm.prepare_steps"]

[project.entry-points."odpm.hooks"]

[project.entry-points."odpm.secrets_providers"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dev_project*"]

[tool.setuptools.dynamic]
version = { attr = "dev_project.constants.RELEASE_VERSION" }

[tool.setuptools.package-data]
dev_project = [
    "container_config/schemas/*.json",
    "manifest/schemas/*.json",
    "templates/*",
    "i18n/**/LC_MESSAGES/*.mo",
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "W"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"dev_project/constants/__init__.py" = ["F403"]
"**/__init__.py" = ["F401"]
"tests/delete_images.py" = ["E402"]
"tests/test_creating_of_new_local_project.py" = ["E402"]
"tests/test_dependency_resolver.py" = ["E402"]
"tests/test_git_build_date.py" = ["E402"]
"tests/test_new_local_project_from_fork.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 16
