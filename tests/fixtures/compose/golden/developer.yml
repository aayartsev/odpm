services:
  db:
    image: postgres:16
    user: root
    tty: true
    ports:
      - 15432:5432
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
  odoo:
    image: odoo-base:dev
    user: 1000:1000
    tty: true
    depends_on:
      - db
    working_dir: /home/odoo
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONWARNINGS=ignore::DeprecationWarning:docutils
      - ODPM_CONFIG_PATH=/run/odpm/config.json
    command:
      - python3
      - -m
      - dev_project.inside_docker_app.run_odoo
      - --
      - /home/odoo/odoo/odoo-bin
    ports:
      - 8069:8069
      - 8072:8072
      - 5678:5678
    volumes:
      - /tmp/odpm-golden-fixture-project/.odpm/runtime/config.json:/run/odpm/config.json:ro,Z
      - /tmp/odpm-golden-fixture-project/.odpm/database:/run/odpm/database:Z
      - /tmp/odpm-golden-local-addons:/home/odoo/extra-addons:Z
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/odpm-golden-postgres-data
